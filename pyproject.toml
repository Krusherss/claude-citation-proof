[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-citation-proof"
version = "0.1.0"
description = "Deterministic web citation proof and Claude Code accountability hooks"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Krusherss" }]

[project.optional-dependencies]
test = ["pytest>=8"]
browser = ["playwright>=1.40"]
pdf = ["PyMuPDF>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
